name: dockspire
services:
  app:
    image: ${DOCKSPIRE_IMAGE:?Set DOCKSPIRE_IMAGE to a published version or image digest}
    command: ["--https", "--setup", "--data-dir", "/appdata", "--tls-hosts", "${DOCKSPIRE_TLS_HOSTS:-}", "--external-url", "${DOCKSPIRE_EXTERNAL_URL:-}"]
    restart: unless-stopped
    ports:
      - "${DOCKSPIRE_BIND_ADDRESS:-0.0.0.0}:${DOCKSPIRE_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dockspire_data:/appdata
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/stacklane", "--healthcheck", "--https"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  dockspire_data:
    name: dockspire_data
