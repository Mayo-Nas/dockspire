name: stacklane-demo
services:
  app:
    build:
      context: ../..
    command: ["--listen", "0.0.0.0:8787", "--demo", "--data-dir", "/appdata"]
    volumes:
      - ../../.local/data-demo:/appdata
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
