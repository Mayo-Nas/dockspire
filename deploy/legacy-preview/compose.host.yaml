services:
  app:
    command: ["--listen", "0.0.0.0:8787", "--data-dir", "/appdata", "--compose-binary", "/docker-plugins/docker-compose", "--host-helper-socket", "/host-helper/control.sock"]
    volumes:
      - type: bind
        source: /run/stacklane-host
        target: /host-helper
        read_only: true
        bind:
          create_host_path: false
