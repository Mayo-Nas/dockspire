name: stacklane-preview
services:
  app:
    image: stacklane-preview:local
    pull_policy: never
    build: .
    command: ["--listen", "0.0.0.0:8787", "--data-dir", "/appdata", "--compose-binary", "/docker-plugins/docker-compose", "--external-url", "${STACKLANE_EXTERNAL_URL:-}"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/appdata
      - type: bind
        source: ${STACKLANE_COMPOSE_PLUGIN_DIR:-/usr/libexec/docker/cli-plugins}
        target: /docker-plugins
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 64
