services:
  app:
    command: ["--listen", "0.0.0.0:8787", "--data-dir", "/appdata", "--portainer-root", "/portainer/compose", "--allow-portainer-import", "--import-environment=${STACKLANE_IMPORT_ENVIRONMENT:-false}"]
    volumes:
      - type: bind
        source: ${PORTAINER_COMPOSE_DIR:?Set the host path to Portainer's compose directory}
        target: /portainer/compose
        read_only: true
        bind:
          create_host_path: false
