name: Publish container image

# Deliberate manual publication only; ordinary pushes/CI never publish an image.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to test and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-dockspire
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Check out version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a main release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run this workflow from main.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the selected source
        run: |
          set -eu
          go test ./...
          go vet ./...
          for test in tests/test-*.mjs; do node "$test"; done
          sh tests/test-installation.sh

      - name: Build and verify the image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          docker build --platform linux/amd64 --build-arg VERSION="$RELEASE_VERSION" --label "org.opencontainers.image.version=$RELEASE_VERSION" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" -t "$image" .
          bash tests/test-container.sh "$image" "$RELEASE_VERSION"
          DOCKSPIRE_TAKEOVER_TEST=1 DOCKSPIRE_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' "$image")" go test ./internal/app -run '^TestTakeoverDockerIntegration$' -count=1 -timeout=5m
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          bash scripts/check-image-security.sh "$image" "$(go env GOPATH)/bin/govulncheck"

      - name: Publish the verified version
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository_metadata="$(gh api "repos/$GITHUB_REPOSITORY")"
          jq -e '.private == true' <<< "$repository_metadata" >/dev/null
          owner_type="$(jq -er '.owner.type' <<< "$repository_metadata")"
          case "$owner_type" in
            User) owner_endpoint=users ;;
            Organization) owner_endpoint=orgs ;;
            *) echo 'Unsupported repository owner type.' >&2; exit 1 ;;
          esac
          package_name="${GITHUB_REPOSITORY#*/}"
          package_name="${package_name,,}"
          package_api="$owner_endpoint/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name"
          require_private_package() {
            gh api "$package_api" | jq -e --arg name "$package_name" --arg repository "$GITHUB_REPOSITORY" '
              .visibility == "private" and .package_type == "container" and .name == $name and
              (.repository == null or .repository.full_name == $repository)
            ' >/dev/null
          }
          require_private_package
          versions="$(gh api --paginate --slurp "$package_api/versions?per_page=100")"
          jq -e --arg version "$RELEASE_VERSION" 'all(.[][]; (.metadata.container.tags | index($version)) == null)' <<< "$versions" >/dev/null
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          # Use an ephemeral Docker config rather than leaving registry credentials behind.
          export DOCKER_CONFIG="$RUNNER_TEMP/dockspire-registry"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_repository="${image%:*}"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | jq -e --arg reference "$image_repository@$digest" 'index($reference) != null' >/dev/null
          for attempt in 1 2 3 4 5; do
            require_private_package
            versions="$(gh api --paginate --slurp "$package_api/versions?per_page=100")"
            published_digest="$(jq -r --arg version "$RELEASE_VERSION" '[.[][] | select(.metadata.container.tags | index($version)) | .name] | if length == 0 then "" elif length == 1 then .[0] else error("Expected exactly one published version") end' <<< "$versions")"
            if [[ -n "$published_digest" ]]; then
              [[ "$published_digest" == "$digest" ]]
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo 'Published version metadata is unavailable; verify the existing publication before retrying.' >&2
              exit 1
            fi
            sleep 3
          done
          printf 'image=%s@%s\n' "$image_repository" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published verified private image: `%s@%s`\n' "$image_repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'DOCKSPIRE_RELEASE_IMAGE=%s@%s\n' "$image_repository" "$digest"
