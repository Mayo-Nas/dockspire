name: Publish container image

# Deliberate manual publication only; ordinary pushes/CI never publish an image.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing licensed-main version tag to test and publish (for example v0.2.0)
        required: true
        type: string

      repository_visibility:
        description: Expected current repository visibility (this workflow never changes it)
        required: true
        default: private
        type: choice
        options: [private, public]
      package_visibility:
        description: Expected current GHCR package visibility (independent of repository)
        required: true
        default: private
        type: choice
        options: [private, public]

permissions:
  contents: read

concurrency:
  group: publish-dockspire
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Mayo-Nas/dockspire' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_REPOSITORY_VISIBILITY: ${{ inputs.repository_visibility }}
      EXPECTED_PACKAGE_VISIBILITY: ${{ inputs.package_visibility }}
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Check out version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a main release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run this workflow from main.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Verify expected publication destination and licensed source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE && test -f NOTICE
          grep -q 'Apache License' LICENSE
          bash scripts/check-release-destination.sh "$EXPECTED_REPOSITORY_VISIBILITY" "$EXPECTED_PACKAGE_VISIBILITY" >/dev/null

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the selected source
        run: |
          set -eu
          go test ./...
          go vet ./...
          for test in tests/test-*.mjs; do node "$test"; done
          sh tests/test-installation.sh
          bash tests/test-release-policy.sh

      - name: Run real-browser smoke test
        shell: bash
        run: bash scripts/check-browser.sh --with-deps

      - name: Build and verify the image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          docker build --platform linux/amd64 --build-arg VERSION="$RELEASE_VERSION" --label "org.opencontainers.image.version=$RELEASE_VERSION" --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" -t "$image" .
          bash tests/test-container.sh "$image" "$RELEASE_VERSION"
          DOCKSPIRE_TAKEOVER_TEST=1 DOCKSPIRE_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' "$image")" go test ./internal/app -run '^TestTakeoverDockerIntegration$' -count=1 -timeout=5m
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          bash scripts/check-image-security.sh "$image" "$(go env GOPATH)/bin/govulncheck"

      - name: Pull verified upgrade baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKSPIRE_BASELINE_PACKAGE_VISIBILITY: ${{ vars.DOCKSPIRE_BASELINE_PACKAGE_VISIBILITY || 'private' }}
        run: bash scripts/pull-upgrade-baseline.sh

      - name: Verify disposable upgrade and rollback without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          previous=$(docker image inspect --format '{{.Id}}' ghcr.io/mayo-nas/dockspire@sha256:4fd7ba7c829c48087d6f76883d7c553c33a4e46737d44583580d5716b2b4303c)
          candidate=$(docker image inspect --format '{{.Id}}' "ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION")
          bash tests/test-upgrade.sh "$previous" "$candidate" "$RELEASE_VERSION"

      - name: Publish the verified version
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package_api="$(bash scripts/check-release-destination.sh "$EXPECTED_REPOSITORY_VISIBILITY" "$EXPECTED_PACKAGE_VISIBILITY")"
          require_expected_destination() {
            local checked
            checked="$(bash scripts/check-release-destination.sh "$EXPECTED_REPOSITORY_VISIBILITY" "$EXPECTED_PACKAGE_VISIBILITY")"
            [[ "$checked" == "$package_api" ]]
          }
          require_expected_destination
          versions="$(gh api --paginate --slurp "$package_api/versions?per_page=100")"
          jq -e --arg version "$RELEASE_VERSION" 'all(.[][]; (.metadata.container.tags | index($version)) == null)' <<< "$versions" >/dev/null
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
          # Use an ephemeral Docker config rather than leaving registry credentials behind.
          export DOCKER_CONFIG="$RUNNER_TEMP/dockspire-registry"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_repository="${image%:*}"
          docker image inspect "$image" --format '{{json .RepoDigests}}' | jq -e --arg reference "$image_repository@$digest" 'index($reference) != null' >/dev/null
          for attempt in 1 2 3 4 5; do
            require_expected_destination
            versions="$(gh api --paginate --slurp "$package_api/versions?per_page=100")"
            published_digest="$(jq -r --arg version "$RELEASE_VERSION" '[.[][] | select(.metadata.container.tags | index($version)) | .name] | if length == 0 then "" elif length == 1 then .[0] else error("Expected exactly one published version") end' <<< "$versions")"
            if [[ -n "$published_digest" ]]; then
              [[ "$published_digest" == "$digest" ]]
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo 'Published version metadata is unavailable; verify the existing publication before retrying.' >&2
              exit 1
            fi
            sleep 3
          done
          printf 'image=%s@%s\n' "$image_repository" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published verified %s image: `%s@%s`\n' "$EXPECTED_PACKAGE_VISIBILITY" "$image_repository" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'DOCKSPIRE_RELEASE_IMAGE=%s@%s\n' "$image_repository" "$digest"
