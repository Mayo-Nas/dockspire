name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build application
        shell: bash
        run: go build -trimpath -o "$RUNNER_TEMP/dockspire${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/dockspire

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in web/*.js; do
            node --check "$script"
          done

      - name: Run browser-code regression tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/test-auth.mjs
          node tests/test-setup.mjs
          node tests/test-navigation.mjs
          node tests/test-stacks.mjs
          node tests/test-revisions.mjs

      - name: Run real-browser smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-browser.sh --with-deps

      - name: Check installation scripts with fixtures
        if: runner.os == 'Linux'
        run: |
          set -eu
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
          sh tests/test-installation.sh
          bash tests/test-release-policy.sh

  source-secrets:
    name: Scan source history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOENV: 'off'
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Install pinned scanner and scan with full redaction
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/security-bin" go install -trimpath github.com/zricethezav/gitleaks/v8@v8.30.1
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          : > "$RUNNER_TEMP/gitleaks-empty-ignore"
          "$RUNNER_TEMP/security-bin/gitleaks" git --redact=100 --no-banner --ignore-gitleaks-allow --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty-ignore" --log-opts='--all --full-history' .

  container:
    name: Check Linux container installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image and check disposable installation
        run: |
          set -eu
          docker build -t dockspire:ci .
          bash tests/test-container.sh dockspire:ci
      - name: Set up Go for image vulnerability checks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Check explicit takeover with disposable workloads
        run: |
          set -eu
          GOTELEMETRY=off GOTOOLCHAIN=local CGO_ENABLED=0 DOCKSPIRE_TAKEOVER_TEST=1 DOCKSPIRE_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' dockspire:ci)" go test ./internal/app -run '^TestTakeoverDockerIntegration$' -count=1 -timeout=5m
      - name: Scan the exact image executables
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          bash scripts/check-image-security.sh dockspire:ci "$(go env GOPATH)/bin/govulncheck"

  upgrade:
    name: Check release upgrade and rollback
    if: github.repository == 'Mayo-Nas/dockspire' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go for the isolated measurement probe
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Build standard-library-only Linux measurement probe
        env:
          GOTOOLCHAIN: local
          GOTELEMETRY: 'off'
          CGO_ENABLED: '0'
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/dockspire-upgrade-probe" ./tests/upgrade-probe
      - name: Build upgrade candidate
        run: docker build --platform linux/amd64 -t dockspire:upgrade .
      - name: Pull verified upgrade baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKSPIRE_BASELINE_PACKAGE_VISIBILITY: ${{ vars.DOCKSPIRE_BASELINE_PACKAGE_VISIBILITY || 'private' }}
        run: bash scripts/pull-upgrade-baseline.sh
      - name: Verify disposable upgrade and rollback without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          previous=$(docker image inspect --format '{{.Id}}' ghcr.io/mayo-nas/dockspire@sha256:4fd7ba7c829c48087d6f76883d7c553c33a4e46737d44583580d5716b2b4303c)
          candidate=$(docker image inspect --format '{{.Id}}' dockspire:upgrade)
          DOCKSPIRE_UPGRADE_PROBE="$RUNNER_TEMP/dockspire-upgrade-probe" bash tests/test-upgrade.sh "$previous" "$candidate" dev
